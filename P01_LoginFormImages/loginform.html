<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="loginform.css">
    <title>Login Form</title>
</head>
<body>
    <main>
 <img src="images/image-photo.jpg" alt="Image of a man " width="100">
    <div class="login-box">
  <h2>Flat Business Profile Widget</h2>
  
  <!-- Image inside the box -->
  <img src="images/user.png" alt="Profile Icon" class="login-image">
  
  <form>
<input type="text" id="username" name="username" placeholder="Name">
<img src="images/pass.png" alt="Profile Icon" class="login-image">
<input type="password" id="password" name="password" placeholder="**********">
<button type="submit">Login</button>
  </form>
</div>

  <footer>© 2016 Flat Business Profile Widget. All rights reserved</footer>
</main>
</body>
</html>
